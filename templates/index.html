<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#007aff">
    <link rel="manifest" href="/static/manifest.json">
    
    <title>TG Multi-Bot</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Экран авторизации */
        .auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #1e1e1e, #2c2c2e);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: rgba(44, 44, 46, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }

        .auth-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 32px;
        }

        .auth-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #3a3a3c;
            border-radius: 12px;
            background: #1c1c1e;
            color: white;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
            -webkit-appearance: none;
        }

        .auth-input:focus {
            border-color: #007aff;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #007aff;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background 0.2s;
            -webkit-appearance: none;
        }

        .auth-btn:active {
            background: #0056b3;
            transform: scale(0.98);
        }

        .auth-link {
            color: #007aff;
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            padding: 8px;
        }

        .error-message {
            color: #ff3b30;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Основной контейнер */
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Навигация */
        .navbar {
            background: #2c2c2e;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #3a3a3c;
            min-height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-back {
            background: none;
            border: none;
            color: #007aff;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            min-width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-back.hidden {
            visibility: hidden;
            pointer-events: none;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-action {
            background: none;
            border: none;
            color: #007aff;
            font-size: 16px;
            cursor: pointer;
            padding: 8px 12px;
            font-weight: 500;
        }

        .nav-action.hidden {
            display: none;
        }

        /* Контент */
        .content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Списки */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8e8e93;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-state-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }

        .empty-state-text {
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .add-btn {
            display: inline-block;
            padding: 12px 24px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .list-item {
            background: #2c2c2e;
            border-radius: 12px;
            padding: 16px;
            margin: 8px 16px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .list-item:active {
            background: #3a3a3c;
        }

        .list-item-avatar {
            width: 48px;
            height: 48px;
            border-radius: 24px;
            background: #007aff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: white;
            flex-shrink: 0;
        }

        .list-item-content {
            flex: 1;
            min-width: 0;
        }

        .list-item-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .list-item-subtitle {
            font-size: 13px;
            color: #8e8e93;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            background: #ff3b30;
            color: white;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 600;
            min-width: 24px;
            text-align: center;
        }

        /* Чат */
        .messages-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            margin-bottom: 2px;
        }

        .message-wrapper.sent {
            align-self: flex-end;
        }

        .message-wrapper.received {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            overflow-wrap: break-word;
            display: inline-block;
        }

        .message-wrapper.sent .message-bubble {
            background: #007aff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-wrapper.received .message-bubble {
            background: #2c2c2e;
            color: white;
            border-bottom-left-radius: 4px;
        }

        .message-meta {
            font-size: 11px;
            color: #8e8e93;
            margin-top: 2px;
            padding: 0 4px;
            display: flex;
            gap: 4px;
        }

        .message-wrapper.sent .message-meta {
            justify-content: flex-end;
        }

        .message-input-area {
            background: #2c2c2e;
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #3a3a3c;
        }

        .message-input {
            flex: 1;
            background: #1c1c1e;
            border: 1px solid #3a3a3c;
            border-radius: 20px;
            padding: 10px 16px;
            color: white;
            font-size: 15px;
            outline: none;
            -webkit-appearance: none;
        }

        .message-input:focus {
            border-color: #007aff;
        }

        .send-button {
            background: #007aff;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .send-button:active {
            background: #0056b3;
            transform: scale(0.95);
        }

        /* Настройки */
        .settings-section {
            margin: 16px;
        }

        .settings-section-title {
            font-size: 12px;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .settings-item {
            background: #2c2c2e;
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .toggle-switch {
            width: 51px;
            height: 31px;
            background: #3a3a3c;
            border-radius: 31px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.on {
            background: #34c759;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 27px;
            height: 27px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }

        .toggle-switch.on::after {
            transform: translateX(20px);
        }

        .logout-btn {
            margin: 16px;
            width: calc(100% - 32px);
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #ff3b30;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .logout-btn:active {
            background: #cc0000;
            transform: scale(0.98);
        }

        .hidden {
            display: none !important;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal {
            background: #2c2c2e;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #3a3a3c;
            border-radius: 10px;
            background: #1c1c1e;
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            -webkit-appearance: none;
        }

        .modal-input:focus {
            border-color: #007aff;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-btn.primary {
            background: #007aff;
            color: white;
        }

        .modal-btn.secondary {
            background: #3a3a3c;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Экран авторизации -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-card">
            <div class="auth-title">📱 TG Bot</div>
            <div class="auth-subtitle">Мульти-бот менеджер</div>
            
            <div id="loginForm">
                <div class="error-message" id="loginError"></div>
                <input type="text" id="loginUsername" class="auth-input" placeholder="Имя пользователя" autocomplete="username">
                <input type="password" id="loginPassword" class="auth-input" placeholder="Пароль" autocomplete="current-password">
                <button class="auth-btn" onclick="handleLogin()">Войти</button>
                <button class="auth-link" onclick="showRegisterForm()">Создать аккаунт</button>
            </div>
            
            <div id="registerForm" class="hidden">
                <div class="error-message" id="registerError"></div>
                <input type="text" id="regUsername" class="auth-input" placeholder="Имя пользователя">
                <input type="password" id="regPassword" class="auth-input" placeholder="Пароль">
                <input type="password" id="regConfirmPassword" class="auth-input" placeholder="Подтвердите пароль">
                <button class="auth-btn" onclick="handleRegister()">Зарегистрироваться</button>
                <button class="auth-link" onclick="showLoginForm()">Уже есть аккаунт? Войти</button>
            </div>
        </div>
    </div>

    <!-- Основное приложение -->
    <div class="app-container hidden" id="appContainer">
        <!-- Навбар -->
        <div class="navbar">
            <button class="nav-back hidden" id="navBack" onclick="goBack()">←</button>
            <span class="nav-title" id="navTitle">Мои боты</span>
            <button class="nav-action" id="navAction" onclick="handleNavAction()">⚙️</button>
        </div>

        <!-- Контент -->
        <div class="content" id="content">
            <!-- Список ботов -->
            <div id="botsView"></div>
            
            <!-- Список чатов -->
            <div id="chatsView" class="hidden"></div>
            
            <!-- Чат -->
            <div id="messagesView" class="hidden" style="height: 100%; display: flex; flex-direction: column;">
                <div class="messages-area" id="messagesArea"></div>
                <div class="message-input-area">
                    <input type="text" class="message-input" id="messageInput" placeholder="Сообщение..." onkeypress="handleKeyPress(event)">
                    <button class="send-button" onclick="sendMessage()">Отправить</button>
                </div>
            </div>
            
            <!-- Настройки -->
            <div id="settingsView" class="hidden"></div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal">
            <div class="modal-title" id="modalTitle"></div>
            <div id="modalContent"></div>
            <div class="modal-buttons">
                <button class="modal-btn secondary" onclick="closeModal()">Отмена</button>
                <button class="modal-btn primary" id="modalConfirm" onclick="confirmModal()">OK</button>
            </div>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let authToken = localStorage.getItem('authToken');
        let currentView = 'bots';
        let activeBot = null;
        let activeChat = null;
        let socket = null;
        let modalCallback = null;

        // Настройки по умолчанию
        let settings = {
            sound: true,
            notifications: true
        };

        // Загружаем настройки
        const savedSettings = localStorage.getItem('userSettings');
        if (savedSettings) {
            try {
                settings = JSON.parse(savedSettings);
            } catch(e) {}
        }

        // Проверяем авторизацию при загрузке
        if (authToken) {
            checkAuth();
        }

        // Проверка авторизации
        async function checkAuth() {
            try {
                const res = await fetch('/api/check_auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: authToken })
                });
                const data = await res.json();
                
                if (data.authenticated) {
                    showApp();
                    initSocket();
                    navigateTo('bots');
                } else {
                    localStorage.removeItem('authToken');
                    authToken = null;
                }
            } catch (e) {
                console.error('Auth check failed:', e);
            }
        }

        // Показать приложение
        function showApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
        }

        // Показать форму регистрации
        function showRegisterForm() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('loginError').classList.remove('show');
        }

        // Показать форму входа
        function showLoginForm() {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerError').classList.remove('show');
        }

        // Вход
        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            
            if (!username || !password) {
                errorEl.textContent = 'Заполните все поля';
                errorEl.classList.add('show');
                return;
            }
            
            try {
                const btn = document.querySelector('#loginForm .auth-btn');
                btn.textContent = 'Вход...';
                btn.disabled = true;
                
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    authToken = data.token;
                    localStorage.setItem('authToken', authToken);
                    showApp();
                    initSocket();
                    navigateTo('bots');
                } else {
                    errorEl.textContent = data.error || 'Неверные данные';
                    errorEl.classList.add('show');
                }
            } catch (e) {
                errorEl.textContent = 'Ошибка соединения';
                errorEl.classList.add('show');
            } finally {
                const btn = document.querySelector('#loginForm .auth-btn');
                btn.textContent = 'Войти';
                btn.disabled = false;
            }
        }

        // Регистрация
        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;
            const errorEl = document.getElementById('registerError');
            
            if (!username || !password) {
                errorEl.textContent = 'Заполните все поля';
                errorEl.classList.add('show');
                return;
            }
            
            if (username.length < 3) {
                errorEl.textContent = 'Имя должно быть не менее 3 символов';
                errorEl.classList.add('show');
                return;
            }
            
            if (password.length < 4) {
                errorEl.textContent = 'Пароль должен быть не менее 4 символов';
                errorEl.classList.add('show');
                return;
            }
            
            if (password !== confirm) {
                errorEl.textContent = 'Пароли не совпадают';
                errorEl.classList.add('show');
                return;
            }
            
            try {
                const btn = document.querySelector('#registerForm .auth-btn');
                btn.textContent = 'Регистрация...';
                btn.disabled = true;
                
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    authToken = data.token;
                    localStorage.setItem('authToken', authToken);
                    showApp();
                    initSocket();
                    navigateTo('bots');
                } else {
                    errorEl.textContent = data.error || 'Ошибка регистрации';
                    errorEl.classList.add('show');
                }
            } catch (e) {
                errorEl.textContent = 'Ошибка соединения';
                errorEl.classList.add('show');
            } finally {
                const btn = document.querySelector('#registerForm .auth-btn');
                btn.textContent = 'Зарегистрироваться';
                btn.disabled = false;
            }
        }

        // Инициализация WebSocket
        function initSocket() {
            if (socket) return;
            
            socket = io();
            
            socket.on('connect', () => {
                console.log('Socket connected');
            });
            
            socket.on('new_message', (data) => {
                // Если мы сейчас в этом чате - добавляем сообщение
                if (activeBot?.token === data.token && activeChat?.id === data.chat_id && currentView === 'messages') {
                    addMessageBubble(data.message);
                }
                
                // Обновляем списки при необходимости
                if (currentView === 'chats' && activeBot?.token === data.token) {
                    loadChats();
                }
                if (currentView === 'bots') {
                    loadBots();
                }
            });
        }

        // Навигация
        function navigateTo(view) {
            currentView = view;
            
            // Скрываем все view
            document.getElementById('botsView').classList.add('hidden');
            document.getElementById('chatsView').classList.add('hidden');
            document.getElementById('messagesView').classList.add('hidden');
            document.getElementById('settingsView').classList.add('hidden');
            
            const navBack = document.getElementById('navBack');
            const navTitle = document.getElementById('navTitle');
            const navAction = document.getElementById('navAction');
            
            switch(view) {
                case 'bots':
                    document.getElementById('botsView').classList.remove('hidden');
                    navBack.classList.add('hidden');
                    navTitle.textContent = 'Мои боты';
                    navAction.classList.remove('hidden');
                    navAction.textContent = '⚙️';
                    loadBots();
                    break;
                    
                case 'chats':
                    document.getElementById('chatsView').classList.remove('hidden');
                    navBack.classList.remove('hidden');
                    navTitle.textContent = `@${activeBot?.username || 'Чаты'}`;
                    navAction.classList.add('hidden');
                    loadChats();
                    break;
                    
                case 'messages':
                    document.getElementById('messagesView').classList.remove('hidden');
                    navBack.classList.remove('hidden');
                    navTitle.textContent = activeChat?.name || 'Чат';
                    navAction.classList.add('hidden');
                    loadMessages();
                    break;
                    
                case 'settings':
                    document.getElementById('settingsView').classList.remove('hidden');
                    navBack.classList.remove('hidden');
                    navTitle.textContent = 'Настройки';
                    navAction.classList.add('hidden');
                    loadSettings();
                    break;
            }
        }

        function goBack() {
            switch(currentView) {
                case 'chats':
                    navigateTo('bots');
                    break;
                case 'messages':
                    navigateTo('chats');
                    break;
                case 'settings':
                    navigateTo('bots');
                    break;
            }
        }

        function handleNavAction() {
            if (currentView === 'bots') {
                navigateTo('settings');
            }
        }

        // Загрузка ботов
        async function loadBots() {
            const container = document.getElementById('botsView');
            
            if (!authToken) return;
            
            try {
                const res = await fetch('/api/bots', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: authToken })
                });
                
                const bots = await res.json();
                
                let html = '';
                
                if (bots.length === 0) {
                    html = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🤖</div>
                            <div class="empty-state-title">Нет ботов</div>
                            <div class="empty-state-text">Добавьте вашего первого Telegram бота</div>
                            <button class="add-btn" onclick="showAddBotModal()">Добавить бота</button>
                        </div>
                    `;
                } else {
                    html = '<div style="padding-top: 8px;">';
                    bots.forEach(bot => {
                        html += `
                            <div class="list-item" onclick="selectBot('${escapeAttr(bot.token)}', '${escapeAttr(bot.username)}')">
                                <div class="list-item-avatar">🤖</div>
                                <div class="list-item-content">
                                    <div class="list-item-title">@${escapeHtml(bot.username)}</div>
                                    <div class="list-item-subtitle">${bot.chats_count} чатов</div>
                                </div>
                                ${bot.unread_total > 0 ? `<div class="badge">${bot.unread_total}</div>` : ''}
                            </div>
                        `;
                    });
                    html += `
                        <div style="padding: 0 16px; margin-top: 12px;">
                            <button class="add-btn" onclick="showAddBotModal()" style="width: 100%;">+ Добавить бота</button>
                        </div>
                    `;
                    html += '</div>';
                }
                
                container.innerHTML = html;
            } catch (e) {
                console.error('Failed to load bots:', e);
                container.innerHTML = '<div class="empty-state"><div class="empty-state-title">Ошибка загрузки</div></div>';
            }
        }

        function selectBot(token, username) {
            activeBot = { token, username };
            navigateTo('chats');
        }

        // Загрузка чатов
        async function loadChats() {
            const container = document.getElementById('chatsView');
            
            if (!authToken || !activeBot) return;
            
            try {
                const res = await fetch('/api/chats', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: authToken, bot_token: activeBot.token })
                });
                
                const chats = await res.json();
                
                let html = '';
                
                if (chats.length === 0) {
                    html = `
                        <div class="empty-state">
                            <div class="empty-state-icon">💬</div>
                            <div class="empty-state-title">Нет чатов</div>
                            <div class="empty-state-text">У этого бота пока нет активных чатов. Напишите боту в Telegram.</div>
                        </div>
                    `;
                } else {
                    html = '<div style="padding-top: 8px;">';
                    chats.forEach(chat => {
                        html += `
                            <div class="list-item" onclick="selectChat('${escapeAttr(chat.id)}', '${escapeAttr(chat.name)}')">
                                <div class="list-item-avatar">${chat.name.charAt(0).toUpperCase()}</div>
                                <div class="list-item-content">
                                    <div class="list-item-title">${escapeHtml(chat.name)}</div>
                                </div>
                                ${chat.unread > 0 ? `<div class="badge">${chat.unread}</div>` : ''}
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                
                container.innerHTML = html;
            } catch (e) {
                console.error('Failed to load chats:', e);
                container.innerHTML = '<div class="empty-state"><div class="empty-state-title">Ошибка загрузки</div></div>';
            }
        }

        function selectChat(chatId, chatName) {
            activeChat = { id: chatId, name: chatName };
            navigateTo('messages');
        }

        // Загрузка сообщений
        async function loadMessages() {
            const container = document.getElementById('messagesArea');
            
            if (!authToken || !activeBot || !activeChat) return;
            
            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        token: authToken, 
                        bot_token: activeBot.token,
                        chat_id: activeChat.id 
                    })
                });
                
                const messages = await res.json();
                container.innerHTML = '';
                
                if (messages.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #8e8e93; padding: 40px;">Нет сообщений</div>';
                } else {
                    messages.forEach(msg => addMessageBubble(msg));
                }
                
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                console.error('Failed to load messages:', e);
                container.innerHTML = '<div style="text-align: center; color: #8e8e93; padding: 40px;">Ошибка загрузки</div>';
            }
        }

        function addMessageBubble(msg) {
            const container = document.getElementById('messagesArea');
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${msg.is_my ? 'sent' : 'received'}`;
            
            const time = new Date(msg.time).toLocaleTimeString('ru-RU', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            wrapper.innerHTML = `
                <div class="message-bubble">${escapeHtml(msg.text)}</div>
                <div class="message-meta">
                    ${!msg.is_my ? `<span>${escapeHtml(msg.sender || '')}</span>` : ''}
                    <span>${time}</span>
                </div>
            `;
            
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        // Отправка сообщения
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !authToken || !activeBot || !activeChat) return;
            
            input.disabled = true;
            
            try {
                const res = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: authToken,
                        bot_token: activeBot.token,
                        chat_id: activeChat.id,
                        text: text
                    })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    input.value = '';
                    addMessageBubble(data.message);
                } else {
                    alert(data.error || 'Ошибка отправки');
                }
            } catch (e) {
                alert('Ошибка соединения');
            } finally {
                input.disabled = false;
                input.focus();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Настройки
        function loadSettings() {
            const container = document.getElementById('settingsView');
            
            container.innerHTML = `
                <div class="settings-section">
                    <div class="settings-section-title">Уведомления</div>
                    <div class="settings-item" onclick="toggleSound()">
                        <span>🔊 Звук уведомлений</span>
                        <div class="toggle-switch ${settings.sound ? 'on' : ''}" id="soundToggle"></div>
                    </div>
                    <div class="settings-item" onclick="toggleNotifications()">
                        <span>📱 Push-уведомления</span>
                        <div class="toggle-switch ${settings.notifications ? 'on' : ''}" id="notifToggle"></div>
                    </div>
                </div>
                
                <div class="settings-section">
                    <div class="settings-section-title">Управление ботами</div>
                    <div id="botsManageList"></div>
                </div>
                
                <button class="logout-btn" onclick="handleLogout()">Выйти</button>
            `;
            
            loadBotsForManage();
        }

        async function loadBotsForManage() {
            const container = document.getElementById('botsManageList');
            
            if (!authToken) return;
            
            try {
                const res = await fetch('/api/bots', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: authToken })
                });
                
                const bots = await res.json();
                
                if (bots.length === 0) {
                    container.innerHTML = '<div style="color: #8e8e93; padding: 12px;">Нет добавленных ботов</div>';
                    return;
                }
                
                container.innerHTML = bots.map(bot => `
                    <div class="settings-item">
                        <span>@${escapeHtml(bot.username)}</span>
                        <button onclick="removeBot('${escapeAttr(bot.token)}')" style="background: #ff3b30; color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer;">Удалить</button>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Failed to load bots for manage:', e);
            }
        }

        function toggleSound() {
            settings.sound = !settings.sound;
            saveSettings();
            loadSettings();
        }

        function toggleNotifications() {
            settings.notifications = !settings.notifications;
            if (settings.notifications && 'Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
            saveSettings();
            loadSettings();
        }

        function saveSettings() {
            localStorage.setItem('userSettings', JSON.stringify(settings));
            
            if (authToken) {
                fetch('/api/settings/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: authToken, settings })
                }).catch(console.error);
            }
        }

        async function removeBot(token) {
            if (!confirm('Удалить этого бота?')) return;
            
            try {
                const res = await fetch('/api/bots/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: authToken, bot_token: token })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    loadSettings();
                    if (activeBot?.token === token) {
                        activeBot = null;
                        activeChat = null;
                    }
                } else {
                    alert(data.error || 'Ошибка удаления');
                }
            } catch (e) {
                alert('Ошибка соединения');
            }
        }

        // Модальное окно для добавления бота
        function showAddBotModal() {
            document.getElementById('modalTitle').textContent = 'Добавить бота';
            document.getElementById('modalContent').innerHTML = `
                <input type="text" class="modal-input" id="botTokenInput" placeholder="Токен бота от @BotFather">
            `;
            document.getElementById('modalOverlay').classList.remove('hidden');
            modalCallback = addBot;
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
            modalCallback = null;
        }

        function confirmModal() {
            if (modalCallback) {
                modalCallback();
            }
        }

        async function addBot() {
            const tokenInput = document.getElementById('botTokenInput');
            const botToken = tokenInput.value.trim();
            
            if (!botToken) {
                alert('Введите токен бота');
                return;
            }
            
            try {
                const res = await fetch('/api/bots/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: authToken, bot_token: botToken })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    closeModal();
                    if (currentView === 'bots') {
                        loadBots();
                    } else if (currentView === 'settings') {
                        loadSettings();
                    }
                    alert(`Бот @${data.username} добавлен!`);
                } else {
                    alert(data.error || 'Неверный токен');
                }
            } catch (e) {
                alert('Ошибка соединения');
            }
        }

        // Выход
        function handleLogout() {
            localStorage.removeItem('authToken');
            authToken = null;
            activeBot = null;
            activeChat = null;
            currentView = 'bots';
            location.reload();
        }

        // Вспомогательные функции
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            if (!text) return '';
            return text.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        // Обработка Enter на формах авторизации
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (!document.getElementById('authScreen').classList.contains('hidden')) {
                    if (!document.getElementById('loginForm').classList.contains('hidden')) {
                        handleLogin();
                    } else if (!document.getElementById('registerForm').classList.contains('hidden')) {
                        handleRegister();
                    }
                }
            }
        });
    </script>
</body>
</html>
