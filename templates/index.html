<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TG Bot">
    <meta name="theme-color" content="#007aff">
    <meta name="format-detection" content="telephone=no">
    
    <title>Telegram Multi-Bot</title>
    
    <!-- Остальные стили -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* CSS Variables с учетом Safe Area */
        :root {
            --sidebar: #101010;
            --main-bg: #1e1e1e;
            --chat-list: #151515;
            --accent: #007aff;
            --text: #ffffff;
            --text-secondary: #888888;
            --bubble-own: #007aff;
            --bubble-other: #2d2d2d;
            --hover: #2a2a2a;
            --border: #3a3a3a;
            --bubble-radius: 20px;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-size: 14px;
            
            /* Safe Area Insets для iPhone */
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-left: env(safe-area-inset-left, 0px);
            --safe-area-right: env(safe-area-inset-right, 0px);
        }

        body {
            font-family: var(--font-family);
            background: var(--main-bg);
            color: var(--text);
            overflow: hidden;
            font-size: var(--font-size);
            position: fixed;
            width: 100%;
            height: 100%;
            /* Учитываем safe area */
            padding-top: var(--safe-area-top);
            padding-bottom: var(--safe-area-bottom);
        }

        /* App Container */
        .app {
            display: flex;
            height: 100%;
            width: 100%;
            position: relative;
        }

        /* Sidebar - фиксированная */
        .sidebar {
            width: 80px;
            background: var(--sidebar);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            padding-bottom: calc(20px + var(--safe-area-bottom));
            z-index: 10;
            flex-shrink: 0;
        }

        /* Chat List */
        .chat-list {
            width: 300px;
            background: var(--chat-list);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 5;
            transform: translateX(0);
            transition: transform 0.3s ease;
        }

        /* Main Chat Area */
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--main-bg);
            position: relative;
            min-width: 0;
        }

        .chat-header {
            padding: 20px;
            padding-top: calc(20px + var(--safe-area-top));
            background: color-mix(in srgb, var(--main-bg) 95%, black);
            border-bottom: 1px solid var(--border);
            font-size: 16px;
            font-weight: bold;
            color: var(--text);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Messages Area - исправлен скролл */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        /* Input Area - фиксированная снизу */
        .input-area {
            padding: 15px 20px;
            padding-bottom: calc(15px + var(--safe-area-bottom));
            background: var(--main-bg);
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid var(--border);
            position: sticky;
            bottom: 0;
            z-index: 10;
        }

        /* ... остальные стили как были ... */
        
        /* Mobile Styles */
        @media (max-width: 768px) {
            .sidebar {
                width: 65px;
            }
            
            .chat-list {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 200;
                transform: translateX(-100%);
                width: 85%;
                max-width: 320px;
                transition: transform 0.3s ease;
            }
            
            .chat-list.open {
                transform: translateX(0);
                box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            }
            
            /* Оверлей для закрытия чат-листа */
            .chat-list-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.5);
                z-index: 199;
            }
            
            .chat-list-overlay.active {
                display: block;
            }
            
            .bot-icon {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
            
            .message {
                max-width: 85%;
            }
            
            .chat-header {
                padding: 15px;
                padding-top: calc(15px + var(--safe-area-top));
            }
            
            .input-area {
                padding: 12px 15px;
                padding-bottom: calc(12px + var(--safe-area-bottom));
            }
            
            .message-input {
                padding: 10px 15px;
                font-size: 16px; /* Предотвращает зум на iOS */
            }
            
            .send-btn, .file-btn {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }
        }

        /* Специально для iPhone с челкой */
        @supports (padding: max(0px)) {
            .chat-header,
            .input-area,
            .sidebar {
                padding-left: max(20px, var(--safe-area-left));
                padding-right: max(20px, var(--safe-area-right));
            }
        }
        
        /* Отключаем выделение на мобильных */
        .bot-icon, .chat-item, .send-btn, .file-btn {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        /* Улучшаем скролл */
        .messages-area, .chats-scroll, .bots-container {
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Оверлей для мобильной версии -->
        <div class="chat-list-overlay" id="chatListOverlay" onclick="closeChatList()"></div>
        
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="bots-container" id="botsContainer">
                <div class="spinner"></div>
            </div>
            <button class="settings-btn" onclick="openSettings()">⚙️</button>
        </div>

        <!-- Chat List -->
        <div class="chat-list" id="chatListSidebar">
            <div class="chat-list-header">Чаты</div>
            <div class="chats-scroll" id="chatsList">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div>Выберите бота</div>
                </div>
            </div>
        </div>

        <!-- Main Chat View -->
        <div class="main-view" id="mainView">
            <div class="chat-header" id="chatHeader">
                Выберите чат
            </div>
            <div class="messages-area" id="messagesArea" draggable="true" ondragover="event.preventDefault()" ondrop="handleFileDrop(event)">
                <div class="empty-state">
                    <div class="empty-state-icon">📱</div>
                    <div>Выберите чат для начала общения</div>
                </div>
            </div>
            <div class="input-area">
                <button class="file-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="file" id="fileInput" style="display: none" onchange="sendFile(this.files[0])">
                <input type="text" class="message-input" id="messageInput" placeholder="Напишите сообщение..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">▲</button>
            </div>
        </div>
    </div>

    <!-- Остальные модальные окна ... -->

    <script>
        // Функции для управления чат-листом на телефоне
        function openChatList() {
            document.getElementById('chatListSidebar').classList.add('open');
            document.getElementById('chatListOverlay').classList.add('active');
        }
        
        function closeChatList() {
            document.getElementById('chatListSidebar').classList.remove('open');
            document.getElementById('chatListOverlay').classList.remove('active');
        }
        
        // Автоматическое определение мобильного устройства
        const isMobile = window.innerWidth <= 768 || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        
        // Добавляем обработчик для открытия чат-листа на мобильных
        if (isMobile) {
            // По клику на иконку меню (можно добавить кнопку в header)
            const header = document.querySelector('.chat-header');
            if (header) {
                header.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                        openChatList();
                    }
                });
            }
            
            // Закрытие по свайпу влево
            let touchStartX = 0;
            document.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
            });
            
            document.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const chatList = document.getElementById('chatListSidebar');
                if (touchStartX < 50 && touchEndX > 100 && !chatList.classList.contains('open')) {
                    openChatList();
                } else if (touchEndX < 50 && touchStartX > 100 && chatList.classList.contains('open')) {
                    closeChatList();
                }
            });
        }
        
        // Переопределяем функцию selectChat для закрытия чат-листа
        const originalSelectChat = window.selectChat;
        window.selectChat = async function(chatId, chatName) {
            if (isMobile) {
                closeChatList();
            }
            return originalSelectChat(chatId, chatName);
        };
        
        // Обновляем стили при загрузке
        window.addEventListener('load', () => {
            // Устанавливаем правильную высоту для iOS
            const setHeight = () => {
                const vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
            };
            setHeight();
            window.addEventListener('resize', setHeight);
        });
    </script>
</body>
</html>
